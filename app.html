<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico"/>

    <title>پنل مدیریت روبات مارکت</title>

    <!-- Theme / Status bar -->
    <meta name="theme-color" content="#00A693"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>

    <style>

        /* =========================================================
           DESIGN TOKENS
           Single source of truth for color / shadow / surface values
           used across the admin panel. Values kept byte-for-byte
           identical to the original file.
        ========================================================= */
        :root {
            /* Brand */
            --primary: #00a693;
            --primary-rgb: 0, 166, 147;
            --primary-hover: #008d7e;
            --primary-active: #00796c;
            --primary-light: #e6f6f4;
            --primary-soft: #eef7f6;
            --primary-surface: #f0f7f6;
            --primary-gradient-end: #00c4ae;

            /* Base surfaces */
            --bg: #f4f7f6;
            --bg-muted: #f8fbfc;
            --bg-soft: #fafafa;
            --bg-subtle: #f5f6fa;
            --surface: #ffffff;
            --surface-soft: #f9f9f9;
            --surface-muted: #f1f2f6;
            --surface-raised: rgba(255, 255, 255, 0.9);
            --surface-glass: rgba(255, 255, 255, 0.82);
            --card-bg: #ffffff;

            /* Text */
            --text-main: #2d3436;
            --text-heading: #222222;
            --text-strong: #111827;
            --text-body: #333333;
            --text-muted: #4b5563;
            --text-sub: #636e72;
            --text-soft: #6b7280;
            --text-faint: #8a8f98;
            --text-disabled: #b2bec3;
            --text-placeholder: #9ca3af;
            --text-inverse: #ffffff;

            /* Borders and overlays */
            --border: #e6eeed;
            --border-soft: #edf2f1;
            --border-muted: #dfe4ea;
            --border-strong: #cccccc;
            --divider: rgba(0, 0, 0, 0.05);
            --overlay: rgba(0, 0, 0, 0.4);
            --overlay-soft: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(255, 255, 255, 0.5);
            --navbar-border: rgba(255, 255, 255, 0.3);

            /* Feedback */
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 3px 14px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-glass: 0 10px 30px rgba(0, 0, 0, 0.14);
            --success: #27ae60;
            --success-bright: #22c55e;
            --success-soft: #e3fcef;
            --success-solid: #10b981;
            --danger: #f06565;
            --danger-solid: #ff3b30;
            --danger-bright: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --info-cyan: #00d8d6;

            /* Components */
            --terminal-bg: #1e272e;
            --disabled-bg: #f5f6fa;
            --disabled-control: #cccccc;
        }

        @font-face {
            font-family: 'Vazir';
            src: url('./fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* =========================================================
           BASE / RESET
        ========================================================= */
        * {
            font-family: 'Vazir', sans-serif, Segoe UI, Tahoma, Geneva, Verdana;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding-top: 60px;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button,
        .btn,
        .nav-item,
        .drawer-summary,
        .menu-toggle,
        .mobile-close,
        .user-menu-mobile,
        .user-menu-desktop {
            touch-action: manipulation;
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           COMPONENT: navbar (mobile top bar + desktop sidebar)
        ========================================================= */
        .mobile-navbar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 16px;
            border-bottom: 1px solid var(--navbar-border);

            background-color: var(--card-bg);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .menu-toggle {
            display: block;
            padding: 6px 10px;
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            font-size: 22px;
            cursor: pointer;
        }

        .logo-RobotMarket-navbar-mobile {
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .logo-RobotMarket-navbar-mobile img {
            height: 40px;
        }

        .navbar-right,
        .user-menu-mobile,
        .user-menu-desktop {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-right {
            gap: 14px;
        }

        .user-menu-mobile,
        .user-menu-desktop {
            position: relative;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
        }

        .user-menu-desktop {
            display: none;
            margin-inline: 10px;
            gap: 8px;
        }

        .user-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--border);
            object-fit: cover;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
        }

        .user-dropdown {
            position: absolute;
            top: 45px;
            left: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            min-width: 120px;
            overflow: hidden;
            border-radius: 10px;
            background: var(--surface-raised);
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
        }

        .user-dropdown.open {
            display: flex;
        }

        .user-dropdown a {
            padding: 10px 14px;
            color: var(--text-body);
            font-size: 13px;
            text-decoration: none;
            transition: 0.2s;
        }

        .user-dropdown a:hover {
            background: var(--bg-subtle);
        }

        .logout {
            color: var(--danger-solid);
        }

        .navbar {
            position: fixed;
            top: 0;
            right: -280px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%;
            padding: 76px 20px;
            overflow-x: hidden;
            overflow-y: auto;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            transition: 0.3s ease;
        }

        .sidebar-header,
        .sidebar-footer {
            display: contents;
        }

        .sidebar-nav {
            display: contents;
        }

        .navbar.active {
            right: 0;
        }

        .mobile-close {
            position: absolute;
            top: 25px;
            left: 15px;
            display: block;
            font-size: 15px;
            cursor: pointer;
        }

        .nav-item {
            display: flex;
            justify-content: start;
            align-content: center;
            gap: 10px;
            width: 100%;
            min-height: 44px;
            margin: 4px 0;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-sub);
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease,
            color 0.2s ease,
            transform 0.1s ease;
        }

        .nav-item:hover {
            background: var(--overlay-soft);
            color: var(--primary);
            transform: translateX(-3px);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .logo-RobotMarket {
            position: absolute;
            top: 16px;
            right: 20px;
            display: block;
            height: 30px;
            cursor: pointer;
        }

        .logo-RobotMarket img {
            width: auto;
            height: auto;
            max-height: 40px;
            object-fit: contain;
        }

        .notif-badge-container {
            display: none;
        }

        .notif-badge-container,
        .notif-badge-container-navbar-mobile {
            position: relative;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .notif-badge-container a,
        .notif-badge-container-navbar-mobile a {
            color: var(--text-sub);
        }

        .notif-badge-container-navbar-mobile {
            display: block;
            padding-top: 8px;
        }

        .notif-badge {
            position: absolute;
            top: 0;
            right: -5px;
            min-width: 18px;
            height: 18px;
            border-radius: 999px;
            background: var(--danger-solid);
            color: var(--text-inverse);
            font-size: 10px;
            line-height: 18px;
            text-align: center;
        }

        #overlay {
            display: none;
        }

        #overlay.active {
            position: fixed;
            inset: 0;
            z-index: 1100;
            display: block;
            background: var(--overlay);
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 20px auto;
        }

        .card,
        .compact-card,
        .mini-card,
        .notification-item {
            background: var(--card-bg);
        }

        /* =========================================================
           COMPONENT: card shell + generic form controls
        ========================================================= */
        .card {
            margin-bottom: 20px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            margin-top: 8px;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            outline: none;
            transition: 0.2s;
        }

        input,
        select {
            min-height: 44px;
            border-radius: 6px;
            text-align: center;
        }

        textarea {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            background: var(--surface);
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            width: 100%;
            min-height: 44px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            padding: 10px;
            text-wrap: nowrap;
        }


        .btn:hover {
            background: var(--primary-hover);
            color: white;
        }

        .btn-outline {
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            text-decoration: none;
        }

        .btn-soft {
            width: auto;
            min-width: auto;
            padding: 8px 14px;
            border: 1px solid rgba(var(--primary-rgb), 0.18);
            border-radius: 999px;
            background: rgba(var(--primary-rgb), 0.1);
            box-shadow: none;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
        }

        .btn-soft:hover {
            background: var(--primary);
        }


        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
        }

        .col-index {
            width: 31px;
        }

        .col-qty {
            width: 44px;
        }

        .col-status {
            width: 66px;
            overflow: hidden;
        }

        .col-id {
            width: 50px;
            overflow: hidden;
        }

        .col-price {
            width: 100px;
        }

        .col-settings {
            width: 55px;
        }

        .col-name {
            width: auto;
            text-wrap: nowrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-active {
            background: #e3f7ea;
            color: #1a9c58;
        }

        .badge-inactive {
            background: #eee;
            color: #888;
        }

        .row-inactive {
            background-color: var(--bg-muted);
        }

        .input-display {
            border: none;
            background: transparent;
            pointer-events: none;
            padding: 0;
            color: inherit;
            width: 100%;
        }

        /* =========================================================
           COMPONENT: modal / dialog
        ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            max-width: 90vw;
        }

        .modal-box h3 {
            margin: 0 0 14px;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #555;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        th,
        td {
            text-align: center;
        }

        th {
            padding: 12px;
            border-bottom: 2px solid var(--border);
            background: var(--bg-muted);
            color: var(--text-sub);
            font-size: 13px;
        }

        td {
            padding: 4px;
            border-bottom: 1px solid var(--border);
        }

        /* استایل آیکون در مودال */

        .modal-product-icon {
            font-size: 1rem;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--surface-muted);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin: 0 auto 15px auto;
        }

        .input-number {
            width: 100%;
            text-align: center;
        }

        /* =========================================================
           COMPONENT: full-page loading spinner
        ========================================================= */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-raised);
        }


        .spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner img {
            width: fit-content;
            height: 100px;
            display: block;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .spinner .dots {
            display: flex;
            gap: 8px;
        }

        .spinner .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border-soft);
            animation: dot-fill 1.2s ease-in-out infinite;
        }

        .spinner .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .spinner .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .spinner .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-fill {
            0%, 80%, 100% {
                background: var(--border-soft);
                transform: scale(1);
            }
            40% {
                background: var(--primary);
                transform: scale(1.2);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1.1);
                opacity: 1;
            }
            50% {
                transform: scale(0.85);
                opacity: 0.7;
            }
        }

        #logArea {
            height: 350px;
            padding: 12px;
            overflow-y: auto;
            border-radius: 8px;
            background: var(--terminal-bg);
            color: var(--info-cyan);
            direction: ltr;
            font-family: "Consolas", monospace;
            font-size: 12px;
            line-height: 1.6;
            text-align: left;
        }

        /* =========================================================
           COMPONENT: drawer (collapsible details panel)
        ========================================================= */
        .drawer {
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .drawer-summary {
            min-height: 44px;
            padding: 15px;
            background: var(--bg-muted);
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        .drawer-summary:hover {
            background: var(--primary-soft);
        }

        .drawer-content {
            padding: 16px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.2s ease-out;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
        }

        .section p {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 0;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            transition: background 0.2s ease;
        }

        .section p:hover {
            background: var(--bg);
        }

        .section strong {
            color: var(--text-body);
            font-weight: 600;
        }

        .section span {
            color: var(--primary);
            direction: ltr;
            font-weight: 500;
        }

        /* =========================================================
           COMPONENT: toggle switch
        ========================================================= */
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
        }

        /* =========================================================
           COMPONENT: toast / status badge / notifications
        ========================================================= */
        .toast-content {
            flex: 1;
        }

        .toast-title {
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 700;
        }

        .toast-message {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .toast-close {
            border: 0;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-soft);
            padding: 0 4px;
        }

        .notifications-page {
            display: grid;
            gap: 12px;
        }

        .notification-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .notification-dot {
            flex: none;
            width: 10px;
            height: 10px;
            margin-top: 8px;
            border-radius: 50%;
            background: var(--success-solid);
        }

        .notifications-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .notifications-header h2 {
            margin: 0;
        }

        /* =========================================================
           COMPONENT: app-level confirm/alert modal
           (separate from .modal-overlay above — used for simple
           confirmation dialogs raised from JS, e.g. destructive
           actions)
        ========================================================= */
        .app-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--overlay);
        }

        .app-modal-box {
            width: min(100%, 360px);
            min-width: 280px;
            max-height: 95vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 12px;
            background: var(--surface);
            text-align: center;
        }

        .app-modal-header {
            margin-bottom: 10px;
            font-size: 34px;
        }

        .app-modal-icon {
            display: flex;
            justify-content: center;
            align-content: center;
        }

        .app-modal-message {
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .app-modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 10px;
            font-size: 12px;
        }

        .mini-card.disconnected {
            color: var(--danger);
        }

        .mini-card.connected {
            color: var(--primary);
        }

        .mini-card.warning {
            color: var(--warning);
        }


        .mini-icon {
            display: flex;
            flex: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: rgba(var(--primary-rgb), 0.1);
            font-size: 17px;
        }

        .mini-card span,
        .mini-card strong,
        .info-row span,
        .info-row strong {
            white-space: nowrap;
        }

        .mini-card span {
            display: block;
            margin-bottom: 3px;
            color: var(--text-faint);
        }

        .mini-card strong {
            display: block;
            color: var(--text-heading);
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--text-heading);
            font-size: 14px;
            font-weight: 800;
        }

        .section-title small {
            color: var(--text-placeholder);
            font-size: 11px;
            font-weight: 600;
        }


        .product-icon {
            font-size: 1.2rem;
            background: var(--border-soft);
            padding: 5px;
            border-radius: 8px;
        }

        .btn-manage {
            height: 36px;
            border: 1px solid #d9e2ec;
            background: #fff;
            color: #334e68;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-manage:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #b8c4d1;
        }

        .btn-manage:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes dangerPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.35);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(217, 48, 37, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(217, 48, 37, 0);
            }
        }

        .row-disabled {
            background-color: var(--surface-soft) !important;
            opacity: 0.6;
        }

        .row-disabled input {
            background: transparent;
            border: none !important;
            color: var(--disabled-control) !important;
            pointer-events: none;
        }

        .input-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-family: inherit;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
            margin: 12px 0;
        }


        .switch {
            position: relative;
            display: inline-block;
            flex: none;
            width: 46px;
            height: 24px;
        }


        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch input:disabled + .slider {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .switch input:not(:disabled) + .slider {
            opacity: 1;
            cursor: pointer;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ccc;
            transition: 0.3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .channel-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 10px;
            border-radius: 10px;
            color: #00a693;
            font-weight: 700;
        }

        .channel-badge-error {
            background: #fdecec;
            color: #d93025;
            border-color: rgba(217, 48, 37, 0.2);
        }

        .row-error {
            background: rgba(217, 48, 37, 0.09);
        }

        .row-hidden-store {
            opacity: 0.8;
            background: rgba(128, 128, 128, 0.15);
        }

        .advanced-hint-box {
            background: #f6fffd;
            border: 1px solid rgba(0, 166, 147, 0.18);
            color: #245b56;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .advanced-hint-error {
            background: #fff5f5;
            border-color: rgba(217, 48, 37, 0.22);
            color: #b3261e;
        }

        .btn-danger {
            background: #d93025;
            color: #fff;
            border: 1px solid #d93025;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-danger:hover {
            background: #c6281e;
            border-color: #c6281e;
        }

        .advanced-hint-error-text {
            color: #b3261e;
            line-height: 1.8;
        }

        /* =========================================================
           PAGE: dashboard widgets (mini-cards, top bar, downloads)
        ========================================================= */
        .dashboard-compact {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: var(--bg);
        }

        .top-bar {
            display: flex;
            justify-content: end;
            align-items: center;
        }

        .time-box {
            font-size: 13px;
            color: var(--text-muted);
        }

        .time-jalali {
            font-weight: 600;
            color: var(--text-soft);
        }

        .btn-download {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .btn-download:hover {
            background: var(--primary-hover);
        }

        .mini-card {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 58px;
            padding: 12px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            background: var(--surface);
            border: 1px solid var(--border);
        }

        .compact-card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow);
        }

        .module-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary);
        }


        .page-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            padding: 14px 112px;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);

            border-top: 1px solid rgba(0, 0, 0, 0.06);

            box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.06),
            0 -1px 0 rgba(255, 255, 255, 0.7) inset;

            z-index: 999;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-input {
            text-align: center;
            flex: 1;
        }

        .qty-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-btn:active {
            transform: scale(1.2);
        }

        /* =========================================================
           PAGE: Wi-Fi network list (device info / setup page)
        ========================================================= */
        .wifi-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wifi-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.15s;
        }

        .wifi-item:hover {
            background: var(--primary);
        }

        .wifi-item.wifi-connected {
            background-color: #9bfff4;
        }

        .wifi-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wifi-name {
            font-size: 14px;
        }

        .wifi-status {
            display: flex;
            gap: 4px;
            color: var(--primary);
        }

        .wifi-bars {
            display: flex;
            align-items: flex-end;

            gap: 2px;

            height: 14px;
        }

        .wifi-bars span {
            width: 3px;
            background: #555;
            border-radius: 1px;
        }

        .wifi-bars span:nth-child(1) {
            height: 4px;
        }

        .wifi-bars span:nth-child(2) {
            height: 7px;
        }

        .wifi-bars span:nth-child(3) {
            height: 10px;
        }

        .wifi-bars span:nth-child(4) {
            height: 13px;
        }

        .wifi-bars.level-1 span:nth-child(1) {
            background: #4caf50;
        }

        .wifi-bars.level-2 span:nth-child(-n + 2) {
            background: #4caf50;
        }

        .wifi-bars.level-3 span:nth-child(-n + 3) {
            background: #4caf50;
        }

        .wifi-bars.level-4 span {
            background: #4caf50;
        }

        .wifi-loading {
            padding: 20px;
            text-align: center;

            opacity: 0.7;

            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }

        #volumeSlider {
            flex: 1;
            cursor: pointer;
        }

        /* =========================================================
           COMPONENT: sales trend chart card
        ========================================================= */
        .sales-trend-card {
            padding: 14px;
        }

        .sales-trend-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .sales-trend-header h3 {
            margin: 0;
            font-size: 15px;
        }

        .sales-trend-header small {
            /* NOTE: --muted is not defined in :root (likely meant
               --text-muted). Left exactly as-is — this is a
               pre-existing bug and "fixing" it would change the
               rendered color, which is out of scope for a
               behavior-preserving refactor. Flagging for a future,
               deliberate fix. */
            color: var(--muted);
            font-size: 12px;
        }

        .sales-trend-svg {
            width: 100%;
            /*height: 230px;*/
            display: block;
            margin-bottom: 8px;
        }

        /* =========================================================
           PAGE: dashboard layout & metric grid
        ========================================================= */
        .dashboard-container {
            direction: rtl;
        }

        .dashboard-header {
            background: #ffffff;
            border-radius: 24px;
            padding: 16px 24px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
        }

        .dashboard-greeting {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .greeting-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #e6f7ef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .dashboard-greeting h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        .dashboard-greeting span {
            font-size: 13px;
            color: #64748b;
        }

        .dashboard-date {
            width: 100%;
            text-align: right;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .dashboard-date div {
            font-size: 12px;
            font-weight: 700;
        }

        .dashboard-date small {
            color: #64748b;
            font-size: 13px;
        }

        /* ===========================
       Metric Grid
    =========================== */

        .metric-grid {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(310px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        /* ===========================
               Card
            =========================== */

        .metric-card {
            position: relative;
            display: flex;
            align-items: flex-start;

            min-height: 110px;

            background: #fff;
            border-radius: 18px;
            padding: 18px 18px 18px 78px;

            box-shadow: 0 6px 18px rgba(15, 23, 42, .06);
            border: 1px solid #edf2f7;

            transition: .25s;
        }

        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(15, 23, 42, .10);
        }

        /* ===========================
               Icon
            =========================== */

        .metric-icon {
            position: absolute;
            left: 18px;
            top: 18px;

            width: 46px;
            height: 46px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f8ef;
            color: #16a34a;

            flex-shrink: 0;
        }

        .metric-icon svg {
            width: 22px;
            height: 22px;
        }

        /* ===========================
               Content
            =========================== */

        .metric-content {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .metric-title {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 600;
            color: #0f172a;
            line-height: 1.3;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .metric-desc {
            margin-top: 6px;
            font-size: 12px;
            color: #94a3b8;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-list > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }

        .info-list > div:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-list strong {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
        }

        .info-list span {
            font-size: 13px;
            color: #475569;
            text-align: left;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 14px;
            background: #f8fafc;
        }

        .activity-item > div {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .activity-item strong {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }

        .activity-item span {
            font-size: 12px;
            color: #475569;
            line-height: 1.7;
            word-break: break-word;
        }

        .activity-item small {
            font-size: 11px;
            color: #94a3b8;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 72px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-on {
            color: #166534;
            background: #dcfce7;
        }

        .status-off {
            color: #991b1b;
            background: #fee2e2;
        }

        .status-warn {
            color: #92400e;
            background: #fef3c7;
        }

        .status-info {
            color: #1d4ed8;
            background: #dbeafe;
        }

        .volume-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .volume-box input[type="range"] {
            width: 100%;
        }

        #volumeValue {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }

        .volume-muted-state {
            font-size: 12px;
            color: #64748b;
        }

        .empty-state {
            padding: 16px;
            border: 1px dashed rgba(148, 163, 184, 0.3);
            border-radius: 14px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            background: rgba(248, 250, 252, 0.8);
        }

        .sales-trend-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .sales-trend-meta > div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.14);
        }

        .sales-trend-meta strong {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }

        .sales-trend-meta span {
            font-size: 11px;
            color: #64748b;
        }

        .sales-trend-switch {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sales-trend-switch .is-active {
            background: var(--primary);
            color: var(--bg);
        }

        .sales-trend-labels {
            direction: ltr;
            display: grid;
            grid-template-columns: repeat(var(--label-count), minmax(0, 1fr));
            gap: 0;
            margin-top: 10px;
            color: #64748b;
            font-size: 10px;
            text-align: center;
        }

        .sales-trend-labels span {
            display: block;
            min-width: 0;
            white-space: nowrap;
        }

        .sales-trend-labels span.is-hidden {
            visibility: hidden;
        }

        .sales-trend-chart {
            position: relative;
        }

        .sales-trend-tooltip {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 5;
            min-width: 120px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.96);
            color: #fff;
            font-size: 12px;
            line-height: 1.7;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .chart-point-group {
            cursor: pointer;
        }


        .compact-card .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .compact-card .section-title span {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }

        .compact-card .section-title small {
            font-size: 11px;
            color: #94a3b8;
        }

        .last-operation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.16);
        }

        .last-operation > div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .last-operation strong {
            font-size: 13px;
            color: #0f172a;
        }

        .last-operation span {
            font-size: 12px;
            color: #64748b;
        }


        .dev-mode-badge {
            position: fixed;
            bottom: 40px;
            left: 12px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--danger-solid);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            font-family: monospace;
            direction: ltr;
            cursor: pointer;
        }

        .dev-mode-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: dev-pulse 1.5s infinite;
        }


        /* -------------------------- media -------------------------- */

        /* ===========================
            Tablet
         =========================== */

        @media (max-width: 992px) {
            .metric-grid {
                grid-template-columns:repeat(2, 1fr);
            }
        }

        /* ===========================
               Mobile
            =========================== */

        @media (max-width: 600px) {

            .metric-grid {
                grid-template-columns:1fr;
            }

            .metric-card {
                min-height: 100px;
                padding: 16px 16px 16px 72px;
            }

            .metric-value {
                font-size: 20px;
            }

            .metric-icon {
                width: 42px;
                height: 42px;
            }
        }

        @media (max-width: 768px) {
            .activity-item,
            .last-operation,
            .info-list > div {
                flex-direction: column;
                align-items: flex-start;
            }

            .status-badge {
                min-width: auto;
            }

            .sales-trend-meta {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .dashboard-header {
                padding: 14px 16px;
            }
        }

        @media (max-width: 480px) {
            table {
                font-size: 12px;
            }

            .badge {
                font-size: 10px;
                padding: 2px 7px;
            }

            .page-action-bar {
                padding: 14px 14px;
            }

            .sales-trend-labels {
                font-size: 9px;
                margin-top: 6px;
            }
        }

        @media (min-width: 480px) {
            .card {
                padding: 20px;
            }

            .drawer-content {
                padding: 20px;
            }

            .section p {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            .mini-grid {
                grid-template-columns: repeat(3, 1fr);
            }


        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            }
        }

        @media (min-width: 992px) {
            :root {
                --sidebar-width: 264px;
                --sidebar-gap: 24px;
            }

            .page-action-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 310px;
            }

            body {
                padding-top: 0;
                padding-right: calc(var(--sidebar-width) + var(--sidebar-gap));
            }

            .mobile-navbar,
            .mobile-close {
                display: none;
            }

            .navbar {
                position: fixed;
                top: 18px;
                right: 18px;
                bottom: 18px;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                width: var(--sidebar-width);
                height: auto;
                padding: 20px 14px 14px;
                overflow: visible;
                border: 1px solid rgba(var(--primary-rgb), 0.12);
                border-radius: 20px;
                background: rgba(255, 255, 255, 0.9);
                box-shadow: var(--shadow-md);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }

            .sidebar-header {
                display: flex;
                flex-direction: column;
                align-items: center;
                flex: 0 0 auto;
                gap: 8px;
                padding: 6px 8px 22px;
                border-bottom: 1px solid var(--border-soft);
            }

            .sidebar-subtitle {
                color: var(--text-faint);
                font-size: 12px;
            }

            .sidebar-nav {
                display: flex;
                flex: 1 1 auto;
                flex-direction: column;
                gap: 4px;
                padding: 18px 0;
                overflow-y: auto;
                scrollbar-width: thin;
            }

            .nav-item {
                position: relative;
                align-items: center;
                width: 100%;
                min-height: 48px;
                margin: 0;
                padding: 11px 16px;
                border-radius: 12px;
                color: var(--text-sub);
            }

            .nav-item:hover {

                transform: none;
            }

            .nav-item.active {
                background: rgba(var(--primary-rgb), 0.12);
                color: var(--primary);
            }

            .nav-item.active::after {
                position: absolute;
                top: 10px;
                right: -14px;
                width: 4px;
                height: 28px;
                border-radius: 4px 0 0 4px;
                background: var(--primary);
                content: "";
            }

                left: 18px;
                display: block;
                padding: 8px;

            }

                display: block;
                height: auto;
            }

                object-fit: cover;
            }

            .user-menu-desktop {
                display: flex;
                width: 100%;
                min-height: 52px;
                margin: 0;
                padding: 9px 10px;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: var(--bg-muted);
            }

            .user-dropdown {
                right: 0;
                left: 0;
            }

            .container {
                width: calc(100% - 44px);
                max-width: 1440px;
                margin: 24px auto;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dev-pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

    </style>

    // -- Icon system --
    /**
     * یک آیکون SVG را بر اساس نام از مجموعه ICONS برمی‌گرداند و اندازه، کلاس و ضخامت خط آن را تنظیم می‌کند.
     *
     * @param {string} name - نام آیکون مورد نظر (کلید موجود در آبجکت ICONS).
     * @param {Object} [options={}] - تنظیمات اختیاری برای شخصی‌سازی آیکون.
     * @param {number} [options.size=22] - اندازه (عرض و ارتفاع) آیکون بر حسب پیکسل.
     * @param {string} [options.className=""] - نام کلاس (یا کلاس‌های) CSS که به تگ svg اضافه می‌شود.
     * @param {number} [options.stroke=2] - ضخامت خط (stroke-width) آیکون.
     * @returns {string} رشته‌ی HTML/SVG آیکون با تنظیمات اعمال‌شده، یا رشته‌ی خالی در صورت پیدا نشدن آیکون.
     */
    function getIcon(name, options = {}) {
        const {size = 22, className = "", stroke = 2} = options;

        let svg = ICONS[name];

        if (!svg) return "";

        svg = svg
            .replace(/width=".*?"/, `width="${size}"`)
            .replace(/height=".*?"/, `height="${size}"`)
            .replace(/stroke-width=".*?"/, `stroke-width="${stroke}"`);

        if (className) {
            svg = svg.replace("<svg", `<svg class="${className}"`);
        }

        return svg;
    }

    function renderIcons(container = document) {
        container.querySelectorAll("[data-icon]").forEach((el) => {
            const name = el.getAttribute("data-icon");
            const size = el.getAttribute("data-size") || 20;
            const className = el.getAttribute("data-class") || "";

            el.outerHTML = getIcon(name, {size, className});
        });
    }

    function showLoader(show) {
        loader.classList.toggle("hidden", !show);

    function applyDevMode() {
        const devNavItem = document.querySelector('a[href="#/dev"]');

    function toggleMenu() {

    /**
     * یک مودال (پنجره‌ی گفتگو) سفارشی روی صفحه نمایش می‌دهد که می‌تواند
     * پیام، آیکون متناسب با نوع، دکمه‌های تایید/لغو و محتوای HTML اضافی داشته باشد.
     *
     * @param {Object} params - تنظیمات مودال.
     * @param {string} [params.message=""] - متن پیامی که داخل مودال نمایش داده می‌شود (پشتیبانی از HTML).
     * @param {"info"|"noType"|"success"|"warning"|"danger"|"reboot"} [params.type="info"] - نوع مودال که رنگ و آیکون آن را مشخص می‌کند.
     * @param {?Function} [params.onConfirm=null] - تابعی که با کلیک روی دکمه‌ی «تایید» اجرا می‌شود؛ خود المان مودال به‌عنوان آرگومان به آن پاس داده می‌شود.
     * @param {?Function} [params.onCancel=null] - تابعی که با کلیک روی دکمه‌ی «لغو» اجرا می‌شود.
     * @param {boolean} [params.showConfirm=true] - در صورت true بودن، دکمه‌های تایید و لغو نمایش داده می‌شوند.
     * @param {string} [params.extraHtml=""] - محتوای HTML اضافی که بین پیام و دکمه‌ها درج می‌شود (مثلاً فرم یا توضیحات بیشتر).
     * @returns {void}
     */
    function showModal({
                           message = "",
                           type = "info",
                           onConfirm = null,
                           onCancel = null,
                           showConfirm = true,
                           extraHtml = "",
                       }) {
        const types = {
            info: {color: "var(--info)", icon: getIcon("info")},
            noType: {color: "", icon: ""},
            success: {color: "var(--success)", icon: getIcon("success")},
            warning: {color: "var(--warning)", icon: getIcon("warning")},
            danger: {color: "var(--danger)", icon: getIcon("danger")},
            reboot: {color: "var(--info)", icon: getIcon("refresh")},
        };

        const t = types[type] || types.info;

        const modal = document.createElement("div");
        modal.className = "app-modal";

        modal.innerHTML = `
              <div class="app-modal-box">

                  <div class="app-modal-header" style="color:${t.color}">
                      <span class="app-modal-icon">${t.icon}</span>
                  </div>

                  <div class="app-modal-message">
                      ${message}
                  </div>

                  ${extraHtml}

                  ${
            showConfirm
                ? `
                      <div class="app-modal-actions">
                          <button class="btn modal-confirm"> تایید</button>
                          <button class="btn btn-outline modal-cancel">لغو</button>
                      </div>
                      `
                : ""
        }

              </div>
              `;

        document.body.appendChild(modal);

        if (showConfirm) {
            const cancelBtn = modal.querySelector(".modal-cancel");
            const confirmBtn = modal.querySelector(".modal-confirm");

            cancelBtn.onclick = () => {
                modal.remove();
                if (onCancel) onCancel();
            };

            confirmBtn.onclick = () => {
                if (onConfirm) onConfirm(modal);
            };
        }
    }

    async function api(url, method = "GET", data = null) {

        const options = {
            method,
            headers: {
                Authorization: "Bearer " + localStorage.getItem("rm_token"),
            },
        };
        if (data) {
            options.headers["Content-Type"] = "application/json";
            options.body = JSON.stringify(data);
        }
        try {
            const res = await fetch(url, options);

            if (res.status === 401) {
                showToast(
                    "error",
                    `401`,
                    'دسترسی غیر مجاز ❌',
                );
                setTimeout(() => {
                    logout();
                }, 1000)

                return;
            }

            if (res.status && res.status >= 500 && res.status < 600) {
                const err = new Error(`خطای سرور. لطفاً کمی بعد دوباره تلاش کنید.`);
                err.isServerError = true;
                err.statusCode = res.status
                throw err;
            }

            return await res.json();

        } catch (e) {
            if (e.isServerError) {
                showToast(
                    "error",
                    `${e.statusCode}`,
                    e.message,
                );
            } else {
                showToast(
                    "error",
                    "خطا",
                    'خطایی رخ داد. اتصال اینترنت خود را بررسی کنید.',
                );
            }
            return {};
        }
    }

    /**
     * Toast Notification System
     * @param {'success' | 'warning' | 'info' | 'error'} type
     * @param {string} title
     * @param {string} message
     * @param {number} timeout
     */
    function showToast(type = "info", title = "اعلان", message = "", timeout = 5000) {
        let stack = document.getElementById("toastStack");

        if (!stack) {
            stack = document.createElement("div");
            stack.id = "toastStack";
            stack.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                pointer-events: none;
            `;
            document.body.appendChild(stack);
        }

        const el = document.createElement("div");
        el.className = `toast toast-${type}`;
        el.style.cssText = `
            min-width: 280px;
            max-width: 90vw;
            background: #fff;
            color: #222;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            pointer-events: auto;
            transition: transform .25s ease, opacity .25s ease;
            touch-action: pan-y;
            border-right: 4px solid #3b82f6;
        `;

        const colors = {
            success: "#22c55e",
            error: "#ef4444",
            warning: "#f59e0b",
            info: "#3b82f6"
        };

        el.style.borderRightColor = colors[type] || colors.info;

        el.innerHTML = `
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-message" >${message}</div>
            </div>
            <button class="toast-close" aria-label="close" >✕</button>
        `;

        let closed = false;
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        const close = () => {
            if (closed) return;
            closed = true;
            el.style.opacity = "0";
            el.style.transform = "translateY(-10px) scale(.96)";
            setTimeout(() => el.remove(), 250);
        };

        const swipeClose = (direction) => {
            if (closed) return;
            closed = true;
            el.style.opacity = "0";
            el.style.transform = `translateX(${direction > 0 ? 120 : -120}px)`;
            setTimeout(() => el.remove(), 250);
        };

        el.querySelector(".toast-close").addEventListener("click", close);

        el.addEventListener("touchstart", (e) => {
            startX = e.touches[0].clientX;
            currentX = startX;
            isDragging = true;
            el.style.transition = "none";
        });

        el.addEventListener("touchmove", (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const diffX = currentX - startX;

            el.style.transform = `translateX(${diffX}px)`;
            el.style.opacity = `${Math.max(0.4, 1 - Math.abs(diffX) / 200)}`;
        });

        el.addEventListener("touchend", () => {
            if (!isDragging) return;
            isDragging = false;

            const diffX = currentX - startX;
            el.style.transition = "transform .25s ease, opacity .25s ease";

            if (Math.abs(diffX) > 80) {
                swipeClose(diffX);
            } else {
                el.style.transform = "translateX(0)";
                el.style.opacity = "1";
            }
        });

        stack.appendChild(el);

        if (timeout > 0) {
            setTimeout(close, timeout);
        }
    }

    function formatNumber(value) {

    /**
     * فاصله‌ی (گام) نمایش لیبل‌ها روی محور را بر اساس بازه‌ی زمانی مشخص می‌کند
     * تا از شلوغی و همپوشانی لیبل‌ها روی نمودار جلوگیری شود.
     *
     * @param {string} period - نوع بازه‌ی زمانی ("day"، "week"، "month" یا "year").
     * @param {number} totalLabels - تعداد کل لیبل‌هایی که قرار است نمایش داده شوند.
     * @returns {number} فاصله‌ی نمایش لیبل‌ها؛ یعنی از هر چند لیبل، یکی نمایش داده شود.
     */
    function getLabelStep(period, totalLabels) {
        switch (period) {
            case "day":
                return Math.max(1, Math.ceil(totalLabels / 6));

            case "week":
                return 1;

            case "month":
                return 5;

            case "year":
                return 1;

            default:
                return 1;
        }
    }

    function getSalesTrendData(period = "week") {
        const salesChart = dashboardRawData.sales_chart || {};
        const source = salesChart[period];

        if (!source) return null;

        const firstSeries = Array.isArray(source.series)
            ? source.series[0] || {}
            : {};

        return {
            period: source.period,
            currency: source.currency || "IRR",
            labels: source.labels || [],
            series: [
                {
                    key: "sales",
                    data: firstSeries.sales || [],
                },
                {
                    key: "transactions",
                    data: firstSeries.transactions || [],
                },
            ],
            meta: {
                from: source.meta?.from ?? "--",
                to: source.meta?.to ?? "--",
                total_sales: source.meta?.total_sales ?? 0,
                total_transactions: source.meta?.total_transactions ?? 0,
            },
        };
    }

    function getTrendPeriodLabel(period) {
        if (period === "24h") return "۲۴ ساعت گذشته";
        if (period === "7d") return "۷ روز گذشته";
        if (period === "31d") return "ماه جاری";
        if (period === "12m") return "۱۲ ماه گذشته";
        return "--";
    }

    function renderSalesTrendChart(container, trendData) {
        if (!container || !trendData) return;

        const labels = trendData.labels || [];

        const labelStep = getLabelStep(salesTrendPeriod, labels.length);

        const salesSeries =
            (trendData.series || []).find((s) => s.key === "sales")?.data || [];
        const transactionsSeries =
            (trendData.series || []).find((s) => s.key === "transactions")
                ?.data || [];

        if (!salesSeries.length) {
            container.innerHTML = `<div class="empty-state">داده‌ای برای نمایش نمودار وجود ندارد</div>`;
            return;
        }

        const width = 100;
        const height = 42;
        const paddingX = 2;
        const paddingY = 4;

        const max = Math.max(...salesSeries, 1);
        const min = 0;
        const range = Math.max(max - min, 1);

        const stepX =
            labels.length > 1 ? (width - paddingX * 2) / (labels.length - 1) : 0;

        const pointData = salesSeries.map((value, i) => {
            const x = paddingX + i * stepX;
            const normalized = (value - min) / range;
            const y = height - paddingY - normalized * (height - paddingY * 2);

            return {
                x,
                y,
                sales: Number(value || 0),
                transactions: Number(transactionsSeries[i] || 0),
                label: labels[i] || "--",
            };
        });

        const points = pointData
            .map((point) => `${point.x},${point.y.toFixed(2)}`)
            .join(" ");

        const areaPath = (() => {
            const firstX = paddingX;
            const lastX = paddingX + stepX * (salesSeries.length - 1);
            const baseY = height - paddingY;

            let path = `M ${firstX} ${baseY} `;
            path += `L ${pointData[0].x} ${pointData[0].y} `;

            for (let i = 1; i < pointData.length; i++) {
                path += `L ${pointData[i].x} ${pointData[i].y} `;
            }

            path += `L ${lastX} ${baseY} Z`;
            return path;
        })();

        const color = "#0ea5e9";
        const gradientId = `salesGradient-${Math.random().toString(36).slice(2, 8)}`;

        container.innerHTML = `
                <div class="sales-trend-header">
                    <div>
                        <h3>نمودار فروش</h3>
                        <small>${getTrendPeriodLabel(trendData.period)}</small>
                    </div>

                    <div class="sales-trend-switch">
                        <button type="button" class="btn btn-soft ${salesTrendPeriod === "day" ? "is-active" : ""}" data-period="day">
                            روز
                        </button>
                        <button type="button" class="btn btn-soft ${salesTrendPeriod === "week" ? "is-active" : ""}" data-period="week">
                            هفته
                        </button>
                        <button type="button" class="btn btn-soft ${salesTrendPeriod === "month" ? "is-active" : ""}" data-period="month">
                            ماه
                        </button>
                        <button type="button" class="btn btn-soft ${salesTrendPeriod === "year" ? "is-active" : ""}" data-period="year">
                            سال
                        </button>
                    </div>
                </div>

                <div class="sales-trend-chart">
                    <div class="sales-trend-tooltip"></div>

                    <svg class="sales-trend-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="${color}" stop-opacity="0.25" />
                                <stop offset="100%" stop-color="${color}" stop-opacity="0.02" />
                            </linearGradient>
                        </defs>

                        <path d="${areaPath}" fill="url(#${gradientId})" stroke="none"></path>

                        <polyline
                            points="${points}"
                            fill="none"
                            stroke="${color}"
                            stroke-width="0.3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        ></polyline>

                        ${pointData
            .map(
                (point) => `
                                    <g
                                        class="chart-point-group"
                                        data-label="${safe(point.label)}"
                                        data-sales="${point.sales}"
                                        data-transactions="${point.transactions}"
                                    >
                                        <circle cx="${point.x}" cy="${point.y}" r="0.6" fill="${color}"></circle>
                                        <circle cx="${point.x}" cy="${point.y}" r="2" fill="transparent"></circle>
                                    </g>
                                `,
            )
            .join("")}
                    </svg>
                </div>

                 <div class="sales-trend-labels" style="--label-count: ${labels.length};">
                        ${labels
            .map((label, index) => {
                const isLast = index === labels.length - 1;
                const isVisible = index % labelStep === 0 || isLast;

                return `
                                    <span class="${isVisible ? "" : "is-hidden"}">
                                        ${safe(label)}
                                    </span>
                                `;
            })
            .join("")}
                    </div>


                <div class="sales-trend-meta">
                    <div><strong>${formatNumber(trendData.meta?.total_sales || 0)}</strong><span>مجموع فروش</span></div>
                    <div><strong>${formatNumber(trendData.meta?.total_transactions || 0)}</strong><span>تراکنش</span></div>
                    <div><strong>${safe(trendData.currency)}</strong><span>واحد</span></div>
                  <div>
                        <span>
                            <strong>${safe(formatApiDateTime(trendData.meta?.from, false) || "--")}</strong>
                            <span style="margin: 0 4px;">تا</span>
                            <strong>${safe(formatApiDateTime(trendData.meta?.to, false) || "--")}</strong>
                        </span>
                    </div>
                </div>
            `;

        container.querySelectorAll("[data-period]").forEach((btn) => {
            btn.addEventListener("click", () => {
                salesTrendPeriod = btn.dataset.period;
                renderDashboard();
            });
        });

        const chart = container.querySelector(".sales-trend-chart");
        const tooltip = container.querySelector(".sales-trend-tooltip");
        const pointGroups = container.querySelectorAll(".chart-point-group");

        pointGroups.forEach((point) => {
            point.addEventListener("mouseenter", () => {
                const label = point.dataset.label || "--";
                const sales = formatNumber(Number(point.dataset.sales || 0));
                const transactions = formatNumber(
                    Number(point.dataset.transactions || 0),

                tooltip.innerHTML = `

                        <div>فروش: ${sales}</div>
                        <div>تراکنش: ${transactions}</div>

            point.addEventListener("mousemove", (event) => {
                const rect = chart.getBoundingClientRect();
                const left = event.clientX - rect.left;
                const top = event.clientY - rect.top;

                tooltip.style.left = `${left + 12}px`;
                tooltip.style.top = `${top - 12}px`;
            });

            point.addEventListener("mouseleave", () => {
                tooltip.style.display = "none";
            });
        });
    }

    /**
     * یک مقدار تاریخ/زمان (رشته یا شیء Date یا هر ورودی قابل تبدیل به Date) را
     * به فرمت تاریخ فارسی (تقویم شمسی) و خوانا برای نمایش تبدیل می‌کند.
     *
     * @param {string|number|Date} value - مقدار تاریخ ورودی (معمولاً رشته‌ی دریافتی از API).
     * @param {boolean} [showTime=true] - در صورت true بودن، ساعت و دقیقه هم به خروجی اضافه می‌شود.
     * @returns {string} تاریخ (و در صورت نیاز ساعت) فرمت‌شده به صورت فارسی؛
     *                    اگر مقدار ورودی خالی باشد "--" و اگر نامعتبر باشد همان مقدار اولیه برگردانده می‌شود.
     */
    function formatApiDateTime(value, showTime = true) {
        if (!value) return "--";

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;

        const options = {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
        };

        if (showTime) {
            options.hour = "2-digit";
            options.minute = "2-digit";
        }

        return new Intl.DateTimeFormat("fa-IR", options).format(date);
    }


    function mapDashboardData(apiData = {}) {

        const today = apiData.today || {};
        const speaker = apiData.speaker || {};
        const lastSale = apiData.last_sale || {};
        const mostSold = apiData.most_sold || {};
        const wifi = apiData.device?.wifi || {};
        const device = apiData.device?.info || {};

        const latestActivity = Array.isArray(apiData.latest_activity)
            ? apiData.latest_activity
            : [];
        const warnings = Array.isArray(apiData.warnings)
            ? apiData.warnings
            : [];
        const notifications = Array.isArray(apiData.notifications)

    function formatDateTime() {
        const now = new Date();

        const gregorianDate = new Intl.DateTimeFormat("en-GB", {
            weekday: "short",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
        }).format(now);

        const gregorianTime = new Intl.DateTimeFormat("en-GB", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
        }).format(now);

        const jalaliDate = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
        }).format(now);

        const jalaliTime = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
        }).format(now);

        return {
            gregorian: `${gregorianDate} | ${gregorianTime}`,
            jalali: `${jalaliDate} | ${jalaliTime}`,
        };
    }

    function startClock() {
        function update() {
            const time = formatDateTime();

            const g = document.querySelector(".time-greg");
            const j = document.querySelector(".time-jalali");

            if (g) g.textContent = time.gregorian;
            if (j) j.textContent = time.jalali;
        }

        update();
        setInterval(update, 3000);
    }
